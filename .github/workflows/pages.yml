name: Deploy manifest to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate models.json
        run: |
          python3 - <<'PY'
          import json, sys
          d = json.load(open("docs/models.json"))
          assert d["schemaVersion"] == 1, "unexpected schemaVersion"
          assert isinstance(d["models"], list) and d["models"], "no models"
          for m in d["models"]:
              for k in ("id","providerId","displayName","shortName","icon","family","externalFamily","roles","tier"):
                  assert k in m, f"missing {k} in {m.get('providerId')}"
          print(f"OK: schemaVersion 1, {len(d['models'])} models")
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
